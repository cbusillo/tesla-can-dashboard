    <pattern id="hatch-stale" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" class="hatch-stale-line"/>

<div id="app">

    <div id="theme" role="group" aria-label="Display brightness"></div>

</div>

<div id="picker" hidden></div>

<script src="app.js" defer></script>
